# Les liaisons d'entrée de Rando (ADR-0017 de Levain). Une liaison par ligne, « # » commence un
# commentaire. Les noms des touches, boutons et axes sont ceux de SDL. Modifier ce fichier ne
# demande aucune recompilation. Les touches sont des positions sur le clavier, pas des lettres : W est
# la touche Z d'un clavier AZERTY.

# La marche du renard, par rapport à la caméra. Une touche vaut ±1 ; l'échelle d'un axe de manette
# l'oriente.
axis move_right   = key:D, key:A:-1, pad:leftx
axis move_forward = key:W, key:S:-1, pad:lefty:-1
action sprint     = key:Left Shift, pad:leftstick
action jump       = key:Space, pad:a

# La caméra (ADR-0030 de Levain). La souris donne un déplacement, la manette une vitesse : le moteur
# ramène les deux à une vitesse, et l'échelle règle la sensibilité. Deux axes chacune : la souris ne
# tourne la caméra que capturée, le stick droit toujours.
axis look_right_mouse = mouse:x:0.15
axis look_up_mouse    = mouse:y:-0.15
axis look_right_pad   = pad:rightx:90
axis look_up_pad      = pad:righty:-90

# La souris est capturée au démarrage : elle tourne la caméra sans bouton. Échap la libère, un clic
# dans la fenêtre la reprend ; dans le navigateur, ce clic est aussi celui qui la capture.
action free_mouse    = key:Escape
action capture_mouse = mouse:left
